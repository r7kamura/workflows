on:
  workflow_call:

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 20
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - uses: salsify/action-detect-and-tag-new-version@v2
        id: tag-new-version
        with:
          version-command: cat src/manifest.json | jq -r .version
      - if: ${{ steps.tag-new-version.outputs.tag }}
        run: cd dist && zip -r ../dist.zip .
      - if: ${{ steps.tag-new-version.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag-new-version.outputs.tag }}
        run: gh release create "$TAG" dist.zip --title "$TAG" --generate-notes
