on:
  workflow_call:
    inputs:
      publish-gem:
        description: Whether to publish the gem to RubyGems.org.
        default: true
        required: false
        type: boolean

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - id: new-version
        run: |
          version_file="$(find lib -name version.rb | head -n 1)"
          extract_version() {
            grep -m 1 -E 'VERSION[[:space:]]*=' | sed -E "s/.*VERSION[[:space:]]*=[[:space:]]*['\"]([^'\"]+)['\"].*/\1/"
          }
          current_version="$(extract_version < "$version_file")"
          previous_version="$(git show "HEAD^:$version_file" 2>/dev/null | extract_version || true)"
          echo "current-version=$current_version" >> "$GITHUB_OUTPUT"
          echo "previous-version=$previous_version" >> "$GITHUB_OUTPUT"
          if [ -z "$current_version" ] || [ "$current_version" = "$previous_version" ]; then
            exit 0
          fi
          tag="v$current_version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "Tag $tag already exists."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' tag -a "$tag" -m "Released version $current_version"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.new-version.outputs.tag && inputs.publish-gem }}
        uses: ruby/setup-ruby@v1.336.0
        with:
          bundler-cache: true
          ruby-version: ruby
      - if: ${{ steps.new-version.outputs.tag && inputs.publish-gem }}
        uses: rubygems/release-gem@v1.4.1
      - if: ${{ steps.new-version.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.new-version.outputs.tag }}
        run: gh release create "$TAG" --generate-notes
