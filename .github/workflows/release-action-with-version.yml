on:
  workflow_call:

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - uses: salsify/action-detect-and-tag-new-version@v2
        id: tag-new-version
        with:
          version-command: cat VERSION 2> /dev/null || true
      - uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          tag_name: ${{ steps.tag-new-version.outputs.tag }}
        if: ${{ steps.tag-new-version.outputs.tag }}
      - if: ${{ steps.tag-new-version.outputs.tag }}
        name: Push HEAD to main version branch
        env:
          TAG: ${{ steps.tag-new-version.outputs.tag }}
        run: |
          branch_name=$(echo "$TAG" | sed -E "s/(v[0-9]+)\..+/\1/")
          git push --force origin "HEAD:refs/heads/${branch_name}"
