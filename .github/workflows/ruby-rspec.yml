on:
  workflow_call:
    inputs:
      ruby-version:
        type: string
permissions: {}

jobs:
  rspec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1.336.0
        with:
          bundler-cache: true
          ruby-version: ${{ inputs.ruby-version }}
      - run: bundle exec rspec --force-color
