on:
  workflow_call:
    secrets:
      cargo-registry-token:
        required: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.cargo-registry-token }}
